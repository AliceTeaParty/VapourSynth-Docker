name: Build and publish images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cu121, cu129]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Compute image version tag
        id: version
        shell: bash
        run: echo "date_tag=$(date -u +%y%m%d)-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
      - name: Build and publish ${{ matrix.variant }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.variant }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/vapoursynth-docker:${{ matrix.variant }}
            ghcr.io/${{ github.repository_owner }}/vapoursynth-docker:${{ steps.version.outputs.date_tag }}
            ghcr.io/${{ github.repository_owner }}/vapoursynth-docker:${{ matrix.variant }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Smoke test ${{ matrix.variant }}
        if: github.event_name == 'pull_request'
        run: >-
          docker run --rm
          ghcr.io/${{ github.repository_owner }}/vapoursynth-docker:${{ matrix.variant }}-${{ github.sha }}
          python -c "import vapoursynth as vs; assert vs.__api_version__.api_major >= 4; clip=vs.core.std.BlankClip(width=16,height=16,length=1,format=vs.GRAY8); assert clip.get_frame(0).width == 16; print(vs.__api_version__)"

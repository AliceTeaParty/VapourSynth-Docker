name: Build and publish images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [generic, cu121, cu129]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Compute image tags
        id: version
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vapoursynth-docker" >> "$GITHUB_OUTPUT"
      - name: Build and publish ${{ matrix.variant }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.variant }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ matrix.variant }}
            ${{ steps.version.outputs.image }}:${{ matrix.variant }}-${{ steps.version.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Smoke test ${{ matrix.variant }}
        if: github.event_name == 'pull_request'
        run: >-
          docker run --rm
          ${{ steps.version.outputs.image }}:${{ matrix.variant }}-${{ steps.version.outputs.short_sha }}
          -c "import sys, vapoursynth as vs; assert vs.__api_version__.api_major >= 4; assert sys.argv[1] != 'generic' or vs.core.std.BlankClip(width=16,height=16,length=1,format=vs.GRAY8).get_frame(0).width == 16; print(vs.__api_version__)"
          ${{ matrix.variant }}

name: Build and publish images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Job summaries remain available; omit the optional .dockerbuild artifact.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [generic, cu121, cu129]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Compute image tags
        id: version
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vapoursynth-docker" >> "$GITHUB_OUTPUT"
      - name: Build and publish ${{ matrix.variant }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.variant }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ matrix.variant }}
            ${{ steps.version.outputs.image }}:${{ matrix.variant }}-${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Smoke test ${{ matrix.variant }}
        if: github.event_name == 'pull_request'
        run: >-
          docker run --rm
          --entrypoint /usr/local/lib/vapoursynth-docker/smoke-image.sh
          ${{ steps.version.outputs.image }}:${{ matrix.variant }}-${{ steps.version.outputs.short_sha }}
          ${{ matrix.variant }}

  verify-published:
    name: Verify published ${{ matrix.variant }}
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        variant: [generic, cu121, cu129]
    steps:
      - name: Pull and smoke-test the published image without registry credentials
        env:
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/vapoursynth-docker:${VARIANT}-${REVISION:0:12}"
          docker pull "$image"
          actual=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
          test "$actual" = "$REVISION"
          docker run --rm --entrypoint /usr/local/lib/vapoursynth-docker/smoke-image.sh "$image" "$VARIANT"
          echo "Verified published image: $image" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect --format '{{json .RepoDigests}}' "$image" >> "$GITHUB_STEP_SUMMARY"
